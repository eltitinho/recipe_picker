<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chez Mamie</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    /* ——— Chez Mamie — menu de restaurant vibrant ——— */
    @font-face {
      font-family: 'Lilita One';
      font-style: normal; font-weight: 400; font-display: swap;
      src: url("fonts/lilita-one-400-latin.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Lilita One';
      font-style: normal; font-weight: 400; font-display: swap;
      src: url("fonts/lilita-one-400-latin-ext.woff2") format("woff2");
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: 'Karla';
      font-style: normal; font-weight: 200 800; font-display: swap;
      src: url("fonts/karla-latin.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Karla';
      font-style: normal; font-weight: 200 800; font-display: swap;
      src: url("fonts/karla-latin-ext.woff2") format("woff2");
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }

    @font-face {
      font-family: 'Amatic SC';
      font-style: normal; font-weight: 400; font-display: swap;
      src: url("fonts/amatic-sc-400-latin.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Amatic SC';
      font-style: normal; font-weight: 400; font-display: swap;
      src: url("fonts/amatic-sc-400-latin-ext.woff2") format("woff2");
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: 'Amatic SC';
      font-style: normal; font-weight: 700; font-display: swap;
      src: url("fonts/amatic-sc-700-latin.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Amatic SC';
      font-style: normal; font-weight: 700; font-display: swap;
      src: url("fonts/amatic-sc-700-latin-ext.woff2") format("woff2");
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }

    :root {
      --red: #CE3A24;
      --red-panel: #A82118;
      --red-deep: #8A1A12;
      --red-dark: #5F100B;
      --cream: #FFF6E8;
      --cream-soft: #F3D9B4;
      --field: #FFFBF2;
      --ink: #2B1A12;
      --gold: #E8A020;
      --gold-bright: #F4B23A;
      --gold-soft: #F6D9A0;
      --gold-line: rgba(246,217,160,0.45);
      --gold-line-soft: rgba(246,217,160,0.28);
      --green: #2F7D4F;
      --green-deep: #256842;
      --error: #FFC9BD;
      --font-display: 'Lilita One', 'Trebuchet MS', sans-serif;
      --font-brand: 'Amatic SC', 'Trebuchet MS', cursive;
      --font-body: 'Karla', system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html {
      scrollbar-color: var(--gold) var(--red-dark);
    }
    ::-webkit-scrollbar { width: 12px; height: 12px; }
    ::-webkit-scrollbar-track { background: var(--red-dark); }
    ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 6px; border: 2px solid var(--red-dark); }
    section ::-webkit-scrollbar-track, .picker-panel::-webkit-scrollbar-track { background: var(--red-deep); }
    section ::-webkit-scrollbar-thumb, .picker-panel::-webkit-scrollbar-thumb { background: rgba(232,160,32,0.75); border-color: var(--red-deep); }

    ::selection { background: var(--gold); color: var(--ink); }

    body {
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.45;
      max-width: 1000px;
      margin: 0 auto;
      padding: 1.25rem;
      color: var(--cream);
      background: var(--red-panel);
      min-height: 100vh;
      accent-color: var(--green);
    }

    :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 4px; }

    h1, h2, h3 { text-wrap: balance; }
    h1 { text-align: center; }
    h2 {
      margin-top: 1.4rem;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 1.55rem;
      letter-spacing: 0.015em;
      color: var(--gold);
      border-bottom: 4px double var(--gold);
      padding-bottom: 0.35rem;
    }
    section.tab-panel > h2:first-child { margin-top: 0; }

    /* ——— Barre supérieure : les onglets d'abord, l'enseigne en dessous ——— */
    header.topbar { display: flex; flex-direction: column; align-items: center; gap: 0.55rem; }
    h1.brand {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      color: var(--cream);
    }
    .brand-logo {
      height: 3.8rem;
      width: 3.8rem;
      border-radius: 50%;
      object-fit: cover;
    }
    .brand-name {
      font-family: var(--font-brand);
      font-weight: 700;
      font-size: 2.3rem;
      letter-spacing: 0.05em;
      line-height: 1;
      text-shadow: 0 2px 0 rgba(46,6,8,0.35);
    }

    /* ——— Onglets : mots peints à même la banquette, soulignés quand actifs ——— */
    nav.tabs {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 0.4rem 1.9rem;
      margin: 0;
      padding-bottom: 0.95rem; /* la place des légendes d'ancien nom au survol */
    }
    nav.tabs .chip {
      position: relative;
      flex: none;
      padding: 0 0 0.22rem;
      border: none;
      border-bottom: 3px solid transparent;
      border-radius: 0;
      background: none;
      box-shadow: none;
      color: var(--cream);
      font-family: var(--font-brand);
      font-weight: 700;
      font-size: 1.55rem;
      letter-spacing: 0.06em;
      line-height: 1.1;
      cursor: pointer;
      text-shadow: 0 2px 0 rgba(46,6,8,0.3);
    }
    nav.tabs .chip:hover { background: none; box-shadow: none; transform: none; color: var(--gold-soft); }
    nav.tabs .chip.active { color: var(--cream); border-bottom-color: var(--gold); }
    .chip-old {
      position: absolute;
      top: calc(100% + 0.35rem);
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-family: var(--font-body);
      font-weight: 800;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      color: var(--gold-soft);
      opacity: 0;
      transition: opacity 0.15s ease;
      pointer-events: none;
    }
    nav.tabs .chip:hover .chip-old, nav.tabs .chip:focus-visible .chip-old { opacity: 1; }

    /* ——— Chip « Le petit enfant » : le compte et les ingrédients s'y cachent ——— */
    .user-chip { position: relative; }
    .user-menu {
      position: absolute;
      top: calc(100% + 0.6rem);
      right: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      min-width: 13rem;
      padding: 0.5rem;
      background: var(--red-dark);
      border: 1.5px solid var(--gold-line);
      border-radius: 10px;
      box-shadow: 0 5px 14px rgba(46,6,8,0.35);
    }
    .user-menu-item {
      padding: 0.45rem 0.6rem;
      border: none;
      border-radius: 6px;
      background: none;
      box-shadow: none;
      text-align: left;
      color: var(--cream);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.92rem;
      letter-spacing: 0.03em;
      cursor: pointer;
    }
    .user-menu-item:hover { background: rgba(232,160,32,0.18); color: var(--gold-bright); transform: none; box-shadow: none; }

    /* ——— Panneaux : le contenu repose directement sur le rouge de la salle ——— */
    section.tab-panel {
      display: none;
      color: var(--cream);
      margin-bottom: 2rem;
    }
    section.tab-panel.active { display: block; animation: panelIn 0.38s cubic-bezier(0.16,1,0.3,1); }
    @keyframes panelIn { from { opacity: 0; transform: translateY(10px); } }
    @media (prefers-reduced-motion: reduce) {
      section.tab-panel.active { animation: none; }
    }

    /* ——— Champs ——— */
    input[type="text"], input[type="number"], input[type="password"], select {
      padding: 0.5rem 0.65rem;
      border: 1.5px solid rgba(232,160,32,0.55);
      border-radius: 8px;
      background: var(--field);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 0.95rem;
      caret-color: var(--red);
    }
    input::placeholder { color: #7A5F4A; }
    input:focus, select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(232,160,32,0.35); outline: none; }

    /* ——— Boutons ——— */
    button {
      padding: 0.55rem 1.1rem;
      border: none;
      border-radius: 999px;
      background: var(--gold);
      color: var(--ink);
      font-family: var(--font-body);
      font-weight: 800;
      font-size: 0.92rem;
      letter-spacing: 0.03em;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(46,6,8,0.3);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    button:hover { background: var(--gold-bright); transform: translateY(-1px); box-shadow: 0 5px 14px rgba(46,6,8,0.35); }
    button:active { transform: translateY(0); box-shadow: 0 2px 6px rgba(46,6,8,0.3); }
    button.delete {
      background: transparent;
      color: var(--cream);
      border: 1.5px solid rgba(255,246,232,0.55);
      box-shadow: none;
      padding: 0.25rem 0.7rem;
      font-size: 0.85rem;
    }
    button.delete:hover { background: rgba(255,246,232,0.14); color: var(--cream); box-shadow: none; transform: none; }
    button.secondary {
      background: transparent;
      color: var(--gold-soft);
      border: 1.5px solid rgba(246,217,160,0.55);
      box-shadow: none;
      font-size: 0.85rem;
    }
    button.secondary:hover { background: rgba(232,160,32,0.2); color: var(--gold-bright); box-shadow: none; transform: none; }


    ul { list-style: none; padding: 0; }
    li { padding: 0.3rem 0; display: flex; align-items: center; gap: 0.5rem; }

    /* ——— Étiquettes / ingrédients ——— */
    .tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .tag {
      background: var(--green);
      border: 1px solid var(--green-deep);
      border-radius: 999px;
      padding: 0.3rem 0.7rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--cream);
      font-weight: 700;
    }
    .error { color: var(--error); font-weight: 700; min-height: 1.2em; font-size: 0.9rem; }

    section.tab-panel h3 {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 1.25rem;
      letter-spacing: 0.015em;
      color: var(--gold-soft);
      margin: 1.2rem 0 0.5rem;
    }
    section.tab-panel h3.category {
      margin: 1.1rem 0 0.35rem;
      font-size: 1.05rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.15rem; margin: 0.5rem 0; }
    .picker-controls { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; flex-wrap: wrap; }
    .picker-controls input { flex: 1; min-width: 180px; }
    .picker-panel {
      max-height: 320px;
      overflow-y: auto;
      border: 1.5px solid var(--gold-line-soft);
      border-radius: 10px;
      padding: 0.4rem 0.9rem 0.9rem;
      background: var(--red-deep);
    }
    .picker-empty { color: var(--cream-soft); font-style: italic; }
    .ingredient-choice { display: flex; align-items: center; gap: 0.4rem; border-radius: 6px; padding: 0.15rem 0.35rem; }
    .ingredient-choice:hover { background: rgba(232,160,32,0.18); }
    .ingredient-choice.checked { background: rgba(47,125,79,0.45); }
    .quantity-input { width: 70px; display: none; }
    .ingredient-choice.checked .quantity-input { display: inline-block; }
    .unit-label { display: none; color: var(--cream-soft); font-size: 0.85rem; }
    .ingredient-choice.checked .unit-label { display: inline; }

    /* ——— Recettes : lignes du menu ——— */
    .recipe { position: relative; border-bottom: 1px dashed var(--gold-line-soft); padding: 0.9rem 0 1rem; }
    .recipe:last-child { border-bottom: none; }
    .recipe::before {
      content: "";
      position: absolute;
      top: 2.05rem;
      left: 0;
      right: 0;
      border-top: 2px dotted rgba(246,217,160,0.4);
    }
    .recipe > strong {
      position: relative;
      display: inline-block;
      background: var(--red-panel);
      padding-right: 0.55rem;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 1.3rem;
      letter-spacing: 0.015em;
      color: var(--cream);
    }
    .recipe > .servings {
      float: right;
      position: relative;
      background: var(--red-panel);
      padding-left: 0.55rem;
      margin-left: 0;
      margin-top: 0.25rem;
      color: var(--gold-soft);
      font-weight: 800;
      font-size: 0.9rem;
    }
    .recipe .ing-list { clear: both; color: var(--cream-soft); font-size: 0.92rem; }
    .ing-vertical { margin: 0.2rem 0 0.4rem; padding-left: 1.2rem; }
    .ing-vertical li { display: list-item; list-style: "— "; padding: 0.1rem 0; }
    .recipe ol.steps { margin: 0.3rem 0; padding-left: 1.5rem; color: var(--cream-soft); font-size: 0.9rem; }
    .recipe ol.steps li { display: list-item; padding: 0.15rem 0; }
    .recipe .recipe-actions { margin-top: 0.45rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .recipe-img {
      width: 100%;
      max-width: 280px;
      border-radius: 8px;
      margin: 0.5rem 0;
      display: block;
      border: 1.5px solid var(--gold-line);
      box-shadow: 0 4px 12px rgba(46,6,8,0.18);
    }
    .recipe-img-placeholder {
      width: 100%;
      max-width: 280px;
      height: 120px;
      border-radius: 8px;
      margin: 0.5rem 0;
      background: var(--red-deep);
      border: 1.5px dashed var(--gold-line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: var(--gold-soft);
    }
    .catalog-search { width: 100%; margin-bottom: 0.9rem; padding: 0.65rem 0.8rem; font-size: 1rem; }
    .badge {
      display: inline-block;
      background: var(--green);
      color: var(--cream);
      border-radius: 999px;
      padding: 0.12rem 0.7rem;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin: 0.35rem 0 0.1rem;
    }

    /* ——— Recette en 3 colonnes (desktop) : photo | ingrédients | préparation ——— */
    .recipe ol.steps::before {
      content: "Préparation :";
      display: block;
      margin-left: -1.5rem;
    }
    @media (min-width: 768px) {
      .recipe {
        display: grid;
        grid-template-columns: 210px 1fr 1fr;
        column-gap: 1.3rem;
      }
      .recipe > strong { grid-column: 1 / 3; grid-row: 1; align-self: start; justify-self: start; }
      .recipe > .servings { grid-column: 3; grid-row: 1; justify-self: end; }
      .recipe > .recipe-img,
      .recipe > .recipe-img-placeholder {
        grid-column: 1;
        grid-row: 2;
        width: 100%;
        max-width: none;
        align-self: start;
        margin-top: 0.15rem;
      }
      .recipe > .badge { grid-column: 1; grid-row: 3; justify-self: start; align-self: start; }
      .recipe > .ing-list {
        grid-column: 2;
        grid-row: 2 / span 2;
        border-left: 4px double var(--gold);
        padding-left: 1.3rem;
      }
      .recipe > ol.steps {
        grid-column: 3;
        grid-row: 2 / span 2;
        border-left: 4px double var(--gold);
        padding-left: 1.8rem;
      }
      .recipe > ol.steps::before { margin-left: -1.5rem; }
      .recipe > .recipe-actions { grid-column: 1 / -1; grid-row: 4; }
    }

    /* ——— Étapes de préparation ——— */
    .step-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 0.7rem;
      margin-bottom: 0.5rem;
      background: var(--red-deep);
      border: 1px solid var(--gold-line-soft);
      border-radius: 10px;
    }
    .step-num { font-family: var(--font-display); color: var(--gold-soft); min-width: 1.5rem; font-size: 1.05rem; }
    .step-desc { flex: 1; min-width: 150px; }
    .step-ings { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .step-ings label {
      background: var(--field);
      border: 1.5px solid rgba(232,160,32,0.6);
      border-radius: 999px;
      padding: 0.18rem 0.65rem;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
    }
    .step-ings input { display: none; }
    .step-ings label:has(input:checked) { background: var(--green); border-color: var(--green-deep); color: var(--cream); }

    /* ——— Écran d'authentification : la porte du restaurant, à même le rouge ——— */
    #auth-screen {
      max-width: 440px;
      margin: 4rem auto;
      color: var(--cream);
    }
    #auth-screen h1.brand { margin: 0 0 1rem; }
    #auth-screen .brand-logo { height: 5.2rem; width: 5.2rem; }
    #auth-screen .brand-name { font-size: 3.1rem; }
    #auth-screen h2 { border-bottom: 4px double var(--gold); }
    #auth-screen form { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1.2rem; }

    .publish-row { margin: 0.8rem 0; }
    .publish-row label { cursor: pointer; font-weight: 700; }
    .servings-row { display: block; margin: 0.6rem 0; color: var(--cream-soft); font-weight: 700; }
    .servings-row input { width: 60px; text-align: center; }

    /* ——— Liste de courses ——— */
    .shopping-recipe { display: flex; align-items: center; gap: 0.5rem; padding: 0.35rem 0; flex-wrap: wrap; }
    .shopping-recipe input[type="number"] { width: 60px; }
    .shopping-recipe .shopping-persons { color: var(--cream-soft); font-size: 0.9rem; }
    #shopping-generate { margin: 0.9rem 0; }
    #shopping-list .shopping-item { display: flex; align-items: center; gap: 0.5rem; }
    #shopping-list .shopping-item input:checked + span { text-decoration: line-through; color: var(--cream-soft); }

    .edit-recipe-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0; border-bottom: 1px dashed var(--gold-line-soft); }
    .edit-recipe-row:last-child { border-bottom: none; }
    .edit-recipe-row .name { flex: 1; font-weight: 700; }

    .image-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin: 0.6rem 0; }
    .image-row input[type="text"] { flex: 1; min-width: 200px; }
    .image-upload-label {
      padding: 0.45rem 0.95rem;
      border-radius: 999px;
      border: 1.5px solid rgba(246,217,160,0.55);
      background: transparent;
      color: var(--gold-soft);
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 0.03em;
      cursor: pointer;
    }
    .image-upload-label:hover { background: rgba(232,160,32,0.2); color: var(--gold-bright); }
    #recipe-image-preview { max-width: 180px; margin: 0; }

    /* ——— Mobile ——— */
    @media (max-width: 640px) {
      body { padding: 0.8rem; }
      .brand-logo { height: 3.2rem; width: 3.2rem; }
      .brand-name { font-size: 1.9rem; }
      nav.tabs { gap: 0.35rem 1.15rem; }
      nav.tabs .chip { font-size: 1.25rem; }
      .chip-old { display: none; }
      .user-menu { right: auto; left: 50%; transform: translateX(-50%); }
      h2 { font-size: 1.3rem; }
      .checkbox-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
      #auth-screen { margin: 2rem auto; }
    }
  </style>
</head>
<body>

  <div id="auth-screen" hidden>
    <h1 class="brand"><img class="brand-logo" src="logo.png" alt=""><span class="brand-name">Chez Mamie</span></h1>
    <h2>Connexion</h2>
    <form id="login-form">
      <input type="text" id="login-username" placeholder="Nom d'utilisateur" required autocomplete="username">
      <input type="password" id="login-password" placeholder="Mot de passe" required autocomplete="current-password">
      <button type="submit">Se connecter</button>
      <p class="error" id="login-error"></p>
    </form>
    <h2>Inscription</h2>
    <form id="register-form">
      <input type="text" id="register-username" placeholder="Nom d'utilisateur (a-z, 0-9, -, _)" required autocomplete="username">
      <input type="password" id="register-password" placeholder="Mot de passe (6 caractères min)" required autocomplete="new-password">
      <button type="submit">Créer mon compte</button>
      <p class="error" id="register-error"></p>
    </form>
  </div>

  <div id="app-screen" hidden>
    <header class="topbar">
      <nav class="tabs">
        <button class="chip active" data-tab="tab-my-recipes"><span class="chip-label">Mes plats</span><span class="chip-old">Mes recettes</span></button>
        <button class="chip" data-tab="tab-catalog"><span class="chip-label">Les recettes de mamie</span><span class="chip-old">Catalogue</span></button>
        <button class="chip" data-tab="tab-add-recipe"><span class="chip-label">Mamie invente une recette</span><span class="chip-old">Gestion de recettes</span></button>
        <button class="chip" data-tab="tab-shopping"><span class="chip-label">Les petites mains</span><span class="chip-old">Liste de courses</span></button>
        <div class="user-chip" id="user-chip">
          <button class="chip" id="user-chip-btn" aria-haspopup="true" aria-expanded="false"><span class="chip-label">Le petit enfant</span><span class="chip-old" id="current-user"></span></button>
          <div class="user-menu" id="user-menu" hidden>
            <button class="user-menu-item" data-tab="tab-ingredients">Gestion des ingrédients</button>
            <button class="user-menu-item" id="logout-btn">Déconnexion</button>
          </div>
        </div>
      </nav>
      <h1 class="brand"><img class="brand-logo" src="logo.png" alt=""><span class="brand-name">Chez Mamie</span></h1>
    </header>

    <section id="tab-my-recipes" class="tab-panel active">
      <h2>Mes recettes</h2>
      <div id="my-recipes"></div>
    </section>

    <section id="tab-catalog" class="tab-panel">
      <h2>Catalogue</h2>
      <input type="text" id="catalog-search" class="catalog-search" placeholder="🔍 Rechercher une recette ou un ingrédient...">
      <div id="catalog-recipes"></div>
    </section>

    <section id="tab-add-recipe" class="tab-panel">
      <h2 id="recipe-form-title">Ajouter une recette</h2>
      <form id="recipe-form">
        <input type="text" id="recipe-name" placeholder="Nom de la recette" required>
        <label class="servings-row">
          Pour <input type="number" id="recipe-servings" min="1" step="1" value="4" required> personnes
        </label>
        <div class="image-row">
          <!-- impeccable-disable broken-image: src assigné par JS à la sélection d'image ; caché (hidden) tant qu'il est vide -->
          <img id="recipe-image-preview" class="recipe-img" alt="Aperçu de l'image" hidden>
          <input type="text" id="recipe-image-url" placeholder="URL de l'image (optionnel)">
          <label class="image-upload-label">
            📷 Depuis mon appareil
            <input type="file" id="recipe-image-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
          </label>
          <button type="button" id="recipe-image-clear" class="secondary" hidden>✕ Image</button>
          <p class="error" id="recipe-image-error"></p>
        </div>
        <label class="publish-row" id="recipe-publish-row">
          <input type="checkbox" id="recipe-publish"> Publier dans le catalogue (visible par tous)
        </label>
        <p>Cochez les ingrédients et indiquez la quantité si besoin :</p>
        <div class="picker-controls">
          <input type="text" id="ingredient-search" placeholder="🔍 Rechercher un ingrédient...">
          <select id="ingredient-filter"></select>
        </div>
        <div class="picker-panel" id="recipe-ingredients-checkboxes"></div>
        <h3>Étapes</h3>
        <div id="steps-list"></div>
        <button type="button" id="add-step-btn">+ Ajouter une étape</button>
        <br><br>
        <button type="submit" id="recipe-submit-btn">Ajouter la recette</button>
        <button type="button" id="recipe-cancel-btn" class="secondary" hidden>Annuler la modification</button>
      </form>
      <p class="error" id="recipe-error"></p>
      <h2>Mes recettes</h2>
      <div id="my-created-recipes"></div>
    </section>

    <section id="tab-shopping" class="tab-panel">
      <h2>Liste de courses</h2>
      <p>Coche les recettes prévues et ajuste le nombre de personnes :</p>
      <div id="shopping-recipes"></div>
      <button id="shopping-generate">Générer la liste de courses</button>
      <p class="error" id="shopping-error"></p>
      <div id="shopping-list"></div>
    </section>

    <section id="tab-ingredients" class="tab-panel">
      <h2>Mes ingrédients</h2>
      <form id="ingredient-form">
        <input type="text" id="ingredient-name" placeholder="Nom de l'ingrédient" required>
        <select id="ingredient-category"></select>
        <button type="submit">Ajouter</button>
      </form>
      <p class="error" id="ingredient-error"></p>
      <div id="ingredient-list"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
