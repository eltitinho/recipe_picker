<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Picker</title>
  <style>
    /* ——— Recipe Picker — menu de restaurant vibrant ——— */
    @font-face {
      font-family: 'Lilita One';
      font-style: normal; font-weight: 400; font-display: swap;
      src: url("fonts/lilita-one-400-latin.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Lilita One';
      font-style: normal; font-weight: 400; font-display: swap;
      src: url("fonts/lilita-one-400-latin-ext.woff2") format("woff2");
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: 'Karla';
      font-style: normal; font-weight: 200 800; font-display: swap;
      src: url("fonts/karla-latin.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Karla';
      font-style: normal; font-weight: 200 800; font-display: swap;
      src: url("fonts/karla-latin-ext.woff2") format("woff2");
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }

    :root {
      --red: #C1272D;
      --red-btn: #A91F24;
      --red-deep: #8F1A1F;
      --red-dark: #6E1418;
      --paper: #FFF7EA;
      --paper-soft: #FCEED6;
      --paper-input: #FFFBF2;
      --ink: #2B1A12;
      --ink-soft: #6B5445;
      --gold: #E8A020;
      --gold-soft: #F6D9A0;
      --gold-line: #D9B36C;
      --border-soft: #E4CFA8;
      --font-display: 'Lilita One', 'Trebuchet MS', sans-serif;
      --font-body: 'Karla', system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html {
      scrollbar-color: var(--gold) var(--red-dark);
    }
    ::-webkit-scrollbar { width: 12px; height: 12px; }
    ::-webkit-scrollbar-track { background: var(--red-dark); }
    ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 6px; border: 2px solid var(--red-dark); }
    section ::-webkit-scrollbar-track, .picker-panel::-webkit-scrollbar-track { background: var(--paper-soft); }
    section ::-webkit-scrollbar-thumb, .picker-panel::-webkit-scrollbar-thumb { background: var(--gold-line); border-color: var(--paper-soft); }

    ::selection { background: var(--gold); color: var(--ink); }

    body {
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.45;
      max-width: 1000px;
      margin: 0 auto;
      padding: 1.25rem;
      color: var(--paper);
      background-color: var(--red);
      background-image:
        radial-gradient(110% 70% at 50% 0%, rgba(255,214,150,0.16), rgba(255,214,150,0) 55%),
        radial-gradient(140% 100% at 50% 100%, rgba(46,6,8,0.35), rgba(46,6,8,0) 60%),
        linear-gradient(180deg, #C83138 0%, var(--red) 45%, var(--red-deep) 100%);
      background-attachment: fixed;
      min-height: 100vh;
      accent-color: var(--red-btn);
    }

    :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 4px; }

    h1, h2, h3 { text-wrap: balance; }
    h1 { text-align: center; }
    h2 {
      margin-top: 1.4rem;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 1.55rem;
      letter-spacing: 0.015em;
      color: var(--red-deep);
      border-bottom: 4px double var(--gold);
      padding-bottom: 0.35rem;
    }
    section.tab-panel > h2:first-child { margin-top: 0; }

    /* ——— Barre supérieure ——— */
    header.topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    header.topbar h1 {
      margin: 0;
      flex: 1;
      text-align: left;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 2.1rem;
      letter-spacing: 0.02em;
      color: var(--paper);
      text-shadow: 0 2px 0 rgba(60,8,10,0.35);
    }
    .user-info { display: flex; align-items: center; gap: 0.6rem; color: var(--gold-soft); font-weight: 700; }

    /* ——— Onglets : sections du menu ——— */
    nav.tabs { display: flex; gap: 0.4rem; margin-top: 1.1rem; }
    nav.tabs button {
      flex: 1;
      padding: 0.65rem 0.8rem 0.75rem;
      border: none;
      border-radius: 10px 10px 0 0;
      background: rgba(46,6,8,0.38);
      color: #F3D9B0;
      font-family: var(--font-display);
      font-size: 1rem;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: none;
    }
    nav.tabs button:hover { background: rgba(46,6,8,0.55); color: var(--paper); transform: none; }
    nav.tabs button.active {
      background: var(--paper);
      color: var(--red-deep);
      box-shadow: 0 -6px 14px rgba(46,6,8,0.18);
    }

    /* ——— Panneaux : papier du menu ——— */
    section.tab-panel {
      display: none;
      background: var(--paper);
      color: var(--ink);
      border-radius: 0 12px 12px 12px;
      padding: 1.4rem 1.6rem 1.6rem;
      margin-bottom: 2rem;
      box-shadow: 0 14px 34px rgba(46,6,8,0.4);
    }
    section.tab-panel.active { display: block; animation: panelIn 0.38s cubic-bezier(0.16,1,0.3,1); }
    @keyframes panelIn { from { opacity: 0; transform: translateY(10px); } }
    @media (prefers-reduced-motion: reduce) {
      section.tab-panel.active { animation: none; }
    }

    /* ——— Champs ——— */
    input[type="text"], input[type="number"], input[type="password"], select {
      padding: 0.5rem 0.65rem;
      border: 1.5px solid var(--border-soft);
      border-radius: 8px;
      background: var(--paper-input);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 0.95rem;
      caret-color: var(--red-btn);
    }
    input::placeholder { color: #7A5F4A; }
    input:focus, select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(232,160,32,0.3); outline: none; }

    /* ——— Boutons ——— */
    button {
      padding: 0.55rem 1.1rem;
      border: none;
      border-radius: 999px;
      background: var(--red-btn);
      color: var(--paper);
      font-family: var(--font-body);
      font-weight: 800;
      font-size: 0.92rem;
      letter-spacing: 0.03em;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(46,6,8,0.3);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    button:hover { background: var(--red-deep); transform: translateY(-1px); box-shadow: 0 5px 14px rgba(46,6,8,0.35); }
    button:active { transform: translateY(0); box-shadow: 0 2px 6px rgba(46,6,8,0.3); }
    button.delete {
      background: transparent;
      color: var(--red-btn);
      border: 1.5px solid var(--red-btn);
      box-shadow: none;
      padding: 0.25rem 0.7rem;
      font-size: 0.82rem;
    }
    button.delete:hover { background: var(--red-btn); color: var(--paper); box-shadow: none; transform: none; }
    button.secondary {
      background: transparent;
      color: var(--ink-soft);
      border: 1.5px solid var(--ink-soft);
      box-shadow: none;
      font-size: 0.85rem;
    }
    button.secondary:hover { background: var(--paper-soft); color: var(--ink); box-shadow: none; transform: none; }
    .user-info button.secondary { border-color: rgba(255,247,234,0.65); color: var(--paper); }
    .user-info button.secondary:hover { background: rgba(255,247,234,0.14); color: var(--paper); }

    ul { list-style: none; padding: 0; }
    li { padding: 0.3rem 0; display: flex; align-items: center; gap: 0.5rem; }

    /* ——— Étiquettes / ingrédients ——— */
    .tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .tag {
      background: var(--gold-soft);
      border: 1px solid var(--gold-line);
      border-radius: 999px;
      padding: 0.3rem 0.7rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--ink);
      font-weight: 700;
    }
    .error { color: var(--red-btn); font-weight: 700; min-height: 1.2em; font-size: 0.9rem; }

    section.tab-panel h3 {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 1.25rem;
      letter-spacing: 0.015em;
      color: var(--red-deep);
      margin: 1.2rem 0 0.5rem;
    }
    section.tab-panel h3.category {
      margin: 1.1rem 0 0.35rem;
      font-size: 1.05rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.15rem; margin: 0.5rem 0; }
    .picker-controls { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; flex-wrap: wrap; }
    .picker-controls input { flex: 1; min-width: 180px; }
    .picker-panel {
      max-height: 320px;
      overflow-y: auto;
      border: 1.5px solid var(--border-soft);
      border-radius: 10px;
      padding: 0.4rem 0.9rem 0.9rem;
      background: var(--paper-soft);
    }
    .picker-empty { color: var(--ink-soft); font-style: italic; }
    .ingredient-choice { display: flex; align-items: center; gap: 0.4rem; border-radius: 6px; padding: 0.15rem 0.35rem; }
    .ingredient-choice:hover { background: rgba(232,160,32,0.16); }
    .ingredient-choice.checked { background: rgba(232,160,32,0.24); }
    .quantity-input { width: 70px; display: none; }
    .ingredient-choice.checked .quantity-input { display: inline-block; }
    .unit-label { display: none; color: var(--ink-soft); font-size: 0.85rem; }
    .ingredient-choice.checked .unit-label { display: inline; }

    /* ——— Recettes : lignes du menu ——— */
    .recipe { position: relative; border-bottom: 1px dashed var(--border-soft); padding: 0.9rem 0 1rem; }
    .recipe:last-child { border-bottom: none; }
    .recipe::before {
      content: "";
      position: absolute;
      top: 2.05rem;
      left: 0;
      right: 0;
      border-top: 2px dotted rgba(107,84,69,0.45);
    }
    .recipe > strong {
      position: relative;
      display: inline-block;
      background: var(--paper);
      padding-right: 0.55rem;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 1.3rem;
      letter-spacing: 0.015em;
      color: var(--red-deep);
    }
    .recipe > .servings {
      float: right;
      position: relative;
      background: var(--paper);
      padding-left: 0.55rem;
      margin-left: 0;
      margin-top: 0.25rem;
      color: var(--ink);
      font-weight: 800;
      font-size: 0.9rem;
    }
    .recipe .ing-list { clear: both; color: var(--ink-soft); font-size: 0.92rem; }
    .ing-vertical { margin: 0.2rem 0 0.4rem; padding-left: 1.2rem; }
    .ing-vertical li { display: list-item; list-style: "— "; padding: 0.1rem 0; }
    .recipe ol.steps { margin: 0.3rem 0; padding-left: 1.5rem; color: var(--ink-soft); font-size: 0.9rem; }
    .recipe ol.steps li { display: list-item; padding: 0.15rem 0; }
    .recipe .recipe-actions { margin-top: 0.45rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .recipe-img {
      width: 100%;
      max-width: 280px;
      border-radius: 8px;
      margin: 0.5rem 0;
      display: block;
      border: 1.5px solid var(--border-soft);
      box-shadow: 0 4px 12px rgba(46,6,8,0.18);
    }
    .recipe-img-placeholder {
      width: 100%;
      max-width: 280px;
      height: 120px;
      border-radius: 8px;
      margin: 0.5rem 0;
      background: var(--paper-soft);
      border: 1.5px dashed var(--gold-line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: var(--ink-soft);
    }
    .catalog-search { width: 100%; margin-bottom: 0.9rem; padding: 0.65rem 0.8rem; font-size: 1rem; }
    .badge {
      display: inline-block;
      background: var(--gold);
      color: var(--ink);
      border-radius: 999px;
      padding: 0.12rem 0.7rem;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin: 0.35rem 0 0.1rem;
    }

    /* ——— Étapes de préparation ——— */
    .step-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 0.7rem;
      margin-bottom: 0.5rem;
      background: var(--paper-soft);
      border: 1px solid var(--border-soft);
      border-radius: 10px;
    }
    .step-num { font-family: var(--font-display); color: var(--red-deep); min-width: 1.5rem; font-size: 1.05rem; }
    .step-desc { flex: 1; min-width: 150px; }
    .step-ings { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .step-ings label {
      background: var(--paper-input);
      border: 1.5px solid var(--gold-line);
      border-radius: 999px;
      padding: 0.18rem 0.65rem;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
    }
    .step-ings input { display: none; }
    .step-ings label:has(input:checked) { background: var(--red-btn); border-color: var(--red-btn); color: var(--paper); }

    /* ——— Écran d'authentification : couverture du menu ——— */
    #auth-screen {
      position: relative;
      max-width: 440px;
      margin: 4rem auto;
      background: var(--paper);
      color: var(--ink);
      border-radius: 16px;
      padding: 2.2rem 2.4rem;
      box-shadow: 0 22px 55px rgba(46,6,8,0.5);
    }
    #auth-screen::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 2px solid rgba(232,160,32,0.65);
      border-radius: 10px;
      pointer-events: none;
    }
    #auth-screen h1 {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 2.2rem;
      color: var(--red-deep);
      margin: 0 0 0.6rem;
      text-shadow: none;
    }
    #auth-screen h2 { border-bottom: 4px double var(--gold); }
    #auth-screen form { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1.2rem; }

    .publish-row { margin: 0.8rem 0; }
    .publish-row label { cursor: pointer; font-weight: 700; }
    .servings-row { display: block; margin: 0.6rem 0; color: var(--ink-soft); font-weight: 700; }
    .servings-row input { width: 60px; text-align: center; }

    /* ——— Liste de courses ——— */
    .shopping-recipe { display: flex; align-items: center; gap: 0.5rem; padding: 0.35rem 0; flex-wrap: wrap; }
    .shopping-recipe input[type="number"] { width: 60px; }
    .shopping-recipe .shopping-persons { color: var(--ink-soft); font-size: 0.9rem; }
    #shopping-generate { margin: 0.9rem 0; }
    #shopping-list .shopping-item { display: flex; align-items: center; gap: 0.5rem; }
    #shopping-list .shopping-item input:checked + span { text-decoration: line-through; color: var(--ink-soft); }

    .edit-recipe-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0; border-bottom: 1px dashed var(--border-soft); }
    .edit-recipe-row:last-child { border-bottom: none; }
    .edit-recipe-row .name { flex: 1; font-weight: 700; }

    .image-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin: 0.6rem 0; }
    .image-row input[type="text"] { flex: 1; min-width: 200px; }
    .image-upload-label {
      padding: 0.45rem 0.95rem;
      border-radius: 999px;
      border: 1.5px solid var(--ink-soft);
      background: transparent;
      color: var(--ink-soft);
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 0.03em;
      cursor: pointer;
    }
    .image-upload-label:hover { background: var(--paper-soft); color: var(--ink); }
    #recipe-image-preview { max-width: 180px; margin: 0; }

    /* ——— Mobile ——— */
    @media (max-width: 640px) {
      body { padding: 0.8rem; }
      header.topbar h1 { font-size: 1.5rem; min-width: 100%; }
      nav.tabs { flex-wrap: wrap; }
      nav.tabs button { flex: 1 1 46%; border-radius: 10px; font-size: 0.92rem; }
      section.tab-panel { border-radius: 12px; padding: 1.1rem 1rem 1.3rem; }
      h2 { font-size: 1.3rem; }
      .checkbox-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
      #auth-screen { margin: 2rem auto; padding: 1.6rem 1.4rem; }
    }
  </style>
</head>
<body>

  <div id="auth-screen" hidden>
    <h1>🍳 Recipe Picker</h1>
    <h2>Connexion</h2>
    <form id="login-form">
      <input type="text" id="login-username" placeholder="Nom d'utilisateur" required autocomplete="username">
      <input type="password" id="login-password" placeholder="Mot de passe" required autocomplete="current-password">
      <button type="submit">Se connecter</button>
      <p class="error" id="login-error"></p>
    </form>
    <h2>Inscription</h2>
    <form id="register-form">
      <input type="text" id="register-username" placeholder="Nom d'utilisateur (a-z, 0-9, -, _)" required autocomplete="username">
      <input type="password" id="register-password" placeholder="Mot de passe (6 caractères min)" required autocomplete="new-password">
      <button type="submit">Créer mon compte</button>
      <p class="error" id="register-error"></p>
    </form>
  </div>

  <div id="app-screen" hidden>
    <header class="topbar">
      <h1>🍳 Recipe Picker</h1>
      <div class="user-info">
        <span id="current-user"></span>
        <button id="logout-btn" class="secondary">Déconnexion</button>
      </div>
    </header>

    <nav class="tabs">
      <button data-tab="tab-selection" class="active">Sélection de recettes</button>
      <button data-tab="tab-add-recipe">Gestion de recettes</button>
      <button data-tab="tab-ingredients">Gestion des ingrédients</button>
      <button data-tab="tab-shopping">🛒 Liste de courses</button>
    </nav>

    <section id="tab-selection" class="tab-panel active">
      <h2>Mes recettes</h2>
      <div id="my-recipes"></div>
      <h2>Catalogue</h2>
      <input type="text" id="catalog-search" class="catalog-search" placeholder="🔍 Rechercher une recette ou un ingrédient...">
      <div id="catalog-recipes"></div>
    </section>

    <section id="tab-add-recipe" class="tab-panel">
      <h2 id="recipe-form-title">Ajouter une recette</h2>
      <form id="recipe-form">
        <input type="text" id="recipe-name" placeholder="Nom de la recette" required>
        <label class="servings-row">
          Pour <input type="number" id="recipe-servings" min="1" step="1" value="4" required> personnes
        </label>
        <div class="image-row">
          <img id="recipe-image-preview" class="recipe-img" alt="Aperçu de l'image" hidden>
          <input type="text" id="recipe-image-url" placeholder="URL de l'image (optionnel)">
          <label class="image-upload-label">
            📷 Depuis mon appareil
            <input type="file" id="recipe-image-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
          </label>
          <button type="button" id="recipe-image-clear" class="secondary" hidden>✕ Image</button>
          <p class="error" id="recipe-image-error"></p>
        </div>
        <label class="publish-row" id="recipe-publish-row">
          <input type="checkbox" id="recipe-publish"> Publier dans le catalogue (visible par tous)
        </label>
        <p>Cochez les ingrédients et indiquez la quantité si besoin :</p>
        <div class="picker-controls">
          <input type="text" id="ingredient-search" placeholder="🔍 Rechercher un ingrédient...">
          <select id="ingredient-filter"></select>
        </div>
        <div class="picker-panel" id="recipe-ingredients-checkboxes"></div>
        <h3>Étapes</h3>
        <div id="steps-list"></div>
        <button type="button" id="add-step-btn">+ Ajouter une étape</button>
        <br><br>
        <button type="submit" id="recipe-submit-btn">Ajouter la recette</button>
        <button type="button" id="recipe-cancel-btn" class="secondary" hidden>Annuler la modification</button>
      </form>
      <p class="error" id="recipe-error"></p>
      <h2>Mes recettes</h2>
      <div id="my-created-recipes"></div>
    </section>

    <section id="tab-shopping" class="tab-panel">
      <h2>Liste de courses</h2>
      <p>Coche les recettes prévues et ajuste le nombre de personnes :</p>
      <div id="shopping-recipes"></div>
      <button id="shopping-generate">Générer la liste de courses</button>
      <p class="error" id="shopping-error"></p>
      <div id="shopping-list"></div>
    </section>

    <section id="tab-ingredients" class="tab-panel">
      <h2>Mes ingrédients</h2>
      <form id="ingredient-form">
        <input type="text" id="ingredient-name" placeholder="Nom de l'ingrédient" required>
        <select id="ingredient-category"></select>
