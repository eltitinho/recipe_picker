# Recipe Picker — reverse proxy nginx
# 1. Crée le fichier de mot de passe :
#      sudo apt install apache2-utils   # si htpasswd absent
#      sudo htpasswd -c /etc/nginx/.htpasswd-recipes kristian
# 2. Obtiens un certificat HTTPS :
#      sudo certbot --nginx -d recettes.example.com
#    (certbot réécrira ce bloc pour ajouter le TLS)

server {
    listen 80;
    server_name recettes.example.com;

    auth_basic "Recipe Picker";
    auth_basic_user_file /etc/nginx/.htpasswd-recipes;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
